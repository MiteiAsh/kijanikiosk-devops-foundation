groups:
- name: kk-payments-alerts

  rules:

  - alert: KkPaymentsPodRestarting
    expr: increase(kube_pod_container_status_restarts_total{pod=~"kk-payments.*"}[5m]) > 0
    for: 1m

    labels:
      severity: warning

    annotations:
      summary: "kk-payments pod restarting"
      description: "A kk-payments pod has restarted within the last 5 minutes."
